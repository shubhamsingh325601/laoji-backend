services:
  postgres:
    image: postgres:16-alpine
    container_name: laoji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: laoji
      POSTGRES_PASSWORD: laoji
      POSTGRES_DB: laoji_dev
    ports:
      # Host port 5433 avoids clashing with a pre-existing local Postgres
      # service already bound to 5432 on this machine.
      - "5433:5432"
    volumes:
      - laoji-postgres-data:/var/lib/postgresql/data
      # Least-privilege app role (Phase 11 hardening) — only applied on a
      # fresh volume; see scripts/init-db/01-create-app-role.sql for how to
      # apply it to an existing local dev volume.
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro

volumes:
  laoji-postgres-data:
